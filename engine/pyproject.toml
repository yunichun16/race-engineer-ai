[project]
name = "race-engineer"
version = "0.1.0"
description = "Deep learning on F1 telemetry: find driver mistakes and compare driving styles, served through Claude."
readme = "README.md"
license = "MIT"
authors = [
    { name = "yunichun16", email = "yunichun16@users.noreply.github.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "anthropic>=1.11.0",
    "duckdb>=1.5.6",
    "fastapi>=0.142.1",
    "httpx2>=2.13.1",
    "mcp>=2.2.0",
    "numpy>=2.5.3",
    "pandas>=2.3.3",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
race-engineer-mcp = "race_engineer.mcp_server.server:main"
race-engineer-data = "race_engineer.data.cli:main"
race-engineer-eval = "race_engineer.evaluation.cli:main"
race-engineer-train = "race_engineer.models.train:main"
race-engineer-experiments = "race_engineer.models.experiments:main"
race-engineer-infer = "race_engineer.inference.cli:main"
race-engineer-api = "race_engineer.api.main:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
cloud = [
    "modal>=1.6.0",
]
dev = [
    "ipykernel>=7.4.0",
    "nbconvert>=7.17.1",
    "nbformat>=5.11.1",
    "onnx>=1.23.1",
    "onnxscript>=0.7.2",
    "pandas-stubs>=2.3,<2.4",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
train = [
    "fastf1>=3.8.3",
    "matplotlib>=3.11.2",
    "mlflow>=3.16.1",
    "onnxruntime>=1.30.0",
    "torch>=2.14.0",
]

[tool.uv]
default-groups = ["dev", "train"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["notebooks"]  # generated by scripts/make_*_notebook.py

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"scripts/make_*_notebook.py" = ["E501"]  # notebook cell source kept as readable literal lines

[tool.pyright]
include = ["src", "tests", "scripts"]
extraPaths = ["tests"]  # scripts import the synthetic test datasets (tests/test_tools_mistakes.py)
pythonVersion = "3.13"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
